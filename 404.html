<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOTHRA HQ — Routing Gateway</title>
  <script>
    (function () {
      var path = window.location.pathname;
      // Handle /admin or /admin/ route redirect
      if (path.indexOf('/admin') !== -1) {
        window.location.replace('admin.html');
      } else {
        window.location.replace('index.html');
      }
    })();
  </script>
</head>
<body style="background:#0b0b0d;color:#d4af37;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  <div style="text-align:center;">
    <h2 style="letter-spacing:0.1em;">MOTHRA HQ &mdash; REDIRECTING...</h2>
    <p style="color:#888;">Mohon tunggu, mengalihkan ke halaman...</p>
  </div>
</body>
</html>
